<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d14"/><stop offset="1" stop-color="#10131d"/></linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8791a7"/></marker>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <text x="38" y="52" fill="#eceef5" font-size="24" font-weight="700">Groundtruth: architecture</text>
  <text x="38" y="76" fill="#9aa3b5" font-size="13.5">Models propose, code verifies, the human decides. Everything runs client-side; the only network call is to the founder's chosen free-tier or local model.</text>

  <!-- ROW 1 -->
  <g stroke-width="1.5">
    <g><rect x="38" y="130" width="140" height="84" rx="14" fill="#1a1d29" stroke="#3a4157"/><text x="108" y="164" fill="#eceef5" font-size="14" font-weight="650" text-anchor="middle">Inputs</text><text x="108" y="184" fill="#9aa3b5" font-size="11.5" text-anchor="middle">transcripts + riskiest</text><text x="108" y="199" fill="#9aa3b5" font-size="11.5" text-anchor="middle">assumptions</text></g>
    <g><rect x="202" y="130" width="140" height="84" rx="14" fill="#3b2a12" stroke="#fbbf24"/><text x="272" y="160" fill="#fde68a" font-size="14" font-weight="650" text-anchor="middle">Gut check</text><text x="272" y="180" fill="#f5deb0" font-size="11.5" text-anchor="middle">HUMAN commits a</text><text x="272" y="195" fill="#f5deb0" font-size="11.5" text-anchor="middle">prediction first</text></g>
    <g><rect x="366" y="130" width="140" height="84" rx="14" fill="#241a45" stroke="#8b5cf6"/><text x="436" y="160" fill="#ddd6fe" font-size="14" font-weight="650" text-anchor="middle">1 · Extract</text><text x="436" y="180" fill="#c4b5fd" font-size="11.5" text-anchor="middle">LLM, per interview</text><text x="436" y="195" fill="#c4b5fd" font-size="11.5" text-anchor="middle">quotes + kind</text></g>
    <g><rect x="530" y="130" width="140" height="84" rx="14" fill="#0b2e36" stroke="#22d3ee"/><text x="600" y="160" fill="#a5f3fc" font-size="14" font-weight="650" text-anchor="middle">Quote verifier</text><text x="600" y="180" fill="#8be9f7" font-size="11.5" text-anchor="middle">CODE: verbatim or</text><text x="600" y="195" fill="#8be9f7" font-size="11.5" text-anchor="middle">rejected</text></g>
    <g><rect x="694" y="130" width="140" height="84" rx="14" fill="#241a45" stroke="#8b5cf6"/><text x="764" y="160" fill="#ddd6fe" font-size="14" font-weight="650" text-anchor="middle">2 · Label</text><text x="764" y="180" fill="#c4b5fd" font-size="11.5" text-anchor="middle">LLM maps evidence</text><text x="764" y="195" fill="#c4b5fd" font-size="11.5" text-anchor="middle">ids to assumptions</text></g>
    <g><rect x="858" y="130" width="140" height="84" rx="14" fill="#0b2e36" stroke="#22d3ee"/><text x="928" y="160" fill="#a5f3fc" font-size="14" font-weight="650" text-anchor="middle">Scoring rules</text><text x="928" y="180" fill="#8be9f7" font-size="11.5" text-anchor="middle">CODE: weighted verdict,</text><text x="928" y="195" fill="#8be9f7" font-size="11.5" text-anchor="middle">confidence, n-cap</text></g>
    <g><rect x="1022" y="130" width="140" height="84" rx="14" fill="#241a45" stroke="#8b5cf6"/><text x="1092" y="160" fill="#ddd6fe" font-size="14" font-weight="650" text-anchor="middle">3 · Red team</text><text x="1092" y="180" fill="#c4b5fd" font-size="11.5" text-anchor="middle">LLM argues the verdict</text><text x="1092" y="195" fill="#c4b5fd" font-size="11.5" text-anchor="middle">is wrong</text></g>
  </g>
  <g stroke="#8791a7" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M178 172H200"/><path d="M342 172H364"/><path d="M506 172H528"/><path d="M670 172H692"/><path d="M834 172H856"/><path d="M998 172H1020"/>
    <path d="M1092 214V328"/>
  </g>

  <!-- ROW 2 (right to left) -->
  <g stroke-width="2">
    <g><rect x="1022" y="330" width="140" height="84" rx="14" fill="#3b2a12" stroke="#fbbf24" stroke-dasharray="0"/><text x="1092" y="358" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">★ CHECKPOINT</text><text x="1092" y="378" fill="#f5deb0" font-size="11.5" text-anchor="middle">HUMAN: accept /</text><text x="1092" y="393" fill="#f5deb0" font-size="11.5" text-anchor="middle">override / park + why</text></g>
    <g><rect x="858" y="330" width="140" height="84" rx="14" fill="#0b2e36" stroke="#22d3ee"/><text x="928" y="360" fill="#a5f3fc" font-size="14" font-weight="650" text-anchor="middle">Gate</text><text x="928" y="380" fill="#8be9f7" font-size="11.5" text-anchor="middle">CODE: all decided,</text><text x="928" y="395" fill="#8be9f7" font-size="11.5" text-anchor="middle">reasons required</text></g>
    <g><rect x="694" y="330" width="140" height="84" rx="14" fill="#241a45" stroke="#8b5cf6"/><text x="764" y="360" fill="#ddd6fe" font-size="14" font-weight="650" text-anchor="middle">4 · Memo draft</text><text x="764" y="380" fill="#c4b5fd" font-size="11.5" text-anchor="middle">LLM, from human-final</text><text x="764" y="395" fill="#c4b5fd" font-size="11.5" text-anchor="middle">verdicts only</text></g>
    <g><rect x="530" y="330" width="140" height="84" rx="14" fill="#0b2e36" stroke="#22d3ee"/><text x="600" y="360" fill="#a5f3fc" font-size="14" font-weight="650" text-anchor="middle">Citation check</text><text x="600" y="380" fill="#8be9f7" font-size="11.5" text-anchor="middle">CODE: every [id] real;</text><text x="600" y="395" fill="#8be9f7" font-size="11.5" text-anchor="middle">audit trail appended</text></g>
    <g><rect x="366" y="330" width="140" height="84" rx="14" fill="#3b2a12" stroke="#fbbf24"/><text x="436" y="360" fill="#fde68a" font-size="14" font-weight="650" text-anchor="middle">Edit + approve</text><text x="436" y="380" fill="#f5deb0" font-size="11.5" text-anchor="middle">HUMAN reads, edits,</text><text x="436" y="395" fill="#f5deb0" font-size="11.5" text-anchor="middle">ticks the box</text></g>
    <g><rect x="202" y="330" width="140" height="84" rx="14" fill="#1a1d29" stroke="#3a4157"/><text x="272" y="360" fill="#eceef5" font-size="14" font-weight="650" text-anchor="middle">Export</text><text x="272" y="380" fill="#9aa3b5" font-size="11.5" text-anchor="middle">memo.md + audit-log</text><text x="272" y="395" fill="#9aa3b5" font-size="11.5" text-anchor="middle">.json, local only</text></g>
  </g>
  <g stroke="#8791a7" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M1022 372H1000"/><path d="M858 372H836"/><path d="M694 372H672"/><path d="M530 372H508"/><path d="M366 372H344"/>
  </g>
  <!-- gut feeds checkpoint -->
  <path d="M272 214V268H1060V328" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#ar)"/>
  <text x="640" y="262" fill="#f5deb0" font-size="11.5" text-anchor="middle">your prediction is shown next to the agent's verdict, so surprises are visible</text>

  <!-- guarantees -->
  <g transform="translate(38,452)">
    <rect width="1124" height="116" rx="16" fill="#12151f" stroke="#262b3b"/>
    <text x="22" y="30" fill="#eceef5" font-size="14" font-weight="650">Four guarantees enforced in code (see tests/run.js)</text>
    <g font-size="12.5" fill="#b4bccd">
      <text x="22" y="58">1. Every quote must appear word for word in the customer's speech.</text>
      <text x="22" y="80">2. Models label evidence; code computes verdicts. Liars get overruled.</text>
      <text x="22" y="102">3. No memo until every assumption has a saved human decision.</text>
      <text x="600" y="58">4. No export until the founder confirms the memo is theirs.</text>
      <text x="600" y="80">Models: Gemini / Groq free tiers, OpenRouter ":free", local Ollama.</text>
      <text x="600" y="102">Live run: about 8 model calls. Sandbox mode: 0 calls.</text>
    </g>
  </g>
  <!-- legend -->
  <g transform="translate(38,596)" font-size="12.5" fill="#b4bccd">
    <rect width="16" height="16" rx="4" fill="#241a45" stroke="#8b5cf6"/><text x="26" y="13">LLM step (free tier / open-weight)</text>
    <rect x="260" width="16" height="16" rx="4" fill="#0b2e36" stroke="#22d3ee"/><text x="286" y="13">Deterministic code</text>
    <rect x="440" width="16" height="16" rx="4" fill="#3b2a12" stroke="#fbbf24"/><text x="466" y="13">Human decision</text>
  </g>
</svg>
