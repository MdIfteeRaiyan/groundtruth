name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          for f in js/*.js tools/*.js tests/*.js; do node --check "$f" || exit 1; done
          node tests/run.js
          python3 tools/contrast-check.py
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8080 > /tmp/groundtruth-http.log 2>&1 &
          FAULTS=1 node tools/mock-openai-server.js > /tmp/groundtruth-mock.log 2>&1 &
          sleep 2
          python tools/browser-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: /tmp/gt-qa-*.png
